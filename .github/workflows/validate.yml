name: Validate prototype (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build src/WinFix.Agent/WinFix.Agent.csproj -c Release --nologo
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: dotnet publish src/WinFix.Agent/WinFix.Agent.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: winfix-phase0-win-x64-unsigned
          path: artifacts/win-x64
          retention-days: 7
